[build-system]
requires = ["maturin>=1.13,<2.0"]
build-backend = "maturin"

[project]
name = "pine-compat-runtime"
version = "0.2.0"
description = "Clean-room Pine-compatible indicator runtime bindings"
requires-python = ">=3.10"
license = "MIT"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
]

[tool.maturin]
manifest-path = "crates/pine-python/Cargo.toml"
module-name = "pine_compat"
