[package]
name = "pine-runtime"
version = "0.2.0"
description.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
chrono = { version = "0.4", default-features = false }
chrono-tz = "0.10"
pine-builtins = { path = "../pine-builtins" }
pine-ir = { path = "../pine-ir" }
regex = "1"
regex-syntax = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode_names2 = "=2.0.0"

[dev-dependencies]
pine-sema = { path = "../pine-sema" }
pine-syntax = { path = "../pine-syntax" }

[lib]
name = "pine_runtime"
path = "src/lib.rs"
