[package]
name = "pine-wasm"
version = "0.1.0"
description.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
name = "pine_wasm"
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[dependencies]
pine-ir = { path = "../pine-ir" }
pine-runtime = { path = "../pine-runtime" }
pine-sema = { path = "../pine-sema" }
pine-syntax = { path = "../pine-syntax" }
serde_json = "1"
wasm-bindgen = "=0.2.121"

[dev-dependencies]
# Keep the Node smoke binding generator byte-for-byte compatible with the
# wasm-bindgen runtime embedded in this crate.
wasm-bindgen-cli-support = "=0.2.121"
