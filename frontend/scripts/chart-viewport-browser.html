<!doctype html><html><head><meta charset="utf-8"><title>Chart viewport lifecycle regressions</title></head><body>
<script type="module">
import { checkLiveSyntheticSession } from "/src/chart-adapter/__tests__/liveSyntheticSession.browser.tsx";
import { checkSemanticSessionViewport } from "/src/chart-adapter/__tests__/semanticSessionViewport.browser.ts";
import { checkOrdinalViewportHydration } from "/src/chart-adapter/__tests__/ordinalViewportHydration.browser.ts";
import { checkReplayCellViewportLifecycle } from "/src/chart-adapter/__tests__/replayCellViewport.browser.tsx";
import { checkReplayInitialPane } from "/src/chart-adapter/__tests__/replayInitialPane.browser.tsx";
import { checkReplayIndicatorProjection } from "/src/chart-adapter/__tests__/replayIndicatorProjection.browser.tsx";
import { checkReplaySyntheticViewportLifecycle, checkReplayDrawingIndicatorReplacement } from "/src/chart-adapter/__tests__/replaySyntheticViewport.browser.tsx";
const checks = { checkLiveSyntheticSession, checkSemanticSessionViewport, checkOrdinalViewportHydration, checkReplayCellViewportLifecycle,
  checkReplayInitialPane, checkReplayIndicatorProjection, checkReplaySyntheticViewportLifecycle, checkReplayDrawingIndicatorReplacement };
// Run every check, then fail with all failures named, so one regression does not hide another.
window.__frontendScriptCheck = async () => {
  const results = {}, failures = [];
  for (const [name, run] of Object.entries(checks)) {
    try { results[name] = await run() ?? "PASS"; }
    catch (error) { failures.push(name + ": " + String(error?.stack ?? error)); }
  }
  if (failures.length) throw new Error(failures.join("\n"));
  return results;
};
window.__frontendScriptEditorCheck = () => ({ status: "PASS", scope: "chart viewport lifecycle regressions" });
</script></body></html>
