name: Unified plugin contract

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'packages/candlescope-plugin-sdk/**'
      - 'backend/scripts/inspect_unified_plugin.py'
      - 'backend/scripts/plugin_sdk_isolation.py'
      - 'backend/app/plugin_lifecycle/**'
      - 'backend/app/local_data/runtime.py'
      - 'backend/app/plugin_security_v2/**'
      - 'backend/tests/test_unified_plugin_store.py'
      - 'backend/tests/test_unified_plugin_runtime.py'
      - 'backend/tests/test_unified_chart_context.py'
      - 'frontend/desktop/unified-entry*'
      - 'frontend/tests/fixtures/unified-runtime-client.mjs'
      - 'backend/tests/conftest.py'
      - 'backend/scripts/unified_plugin.py'
      - 'examples/unified-plugins/**'
      - '.github/workflows/unified-plugin-contract.yml'
  push:
    branches: [main]
    paths:
      - 'packages/candlescope-plugin-sdk/**'
      - 'backend/scripts/inspect_unified_plugin.py'
      - 'backend/scripts/plugin_sdk_isolation.py'
      - 'backend/app/plugin_lifecycle/**'
      - 'backend/app/local_data/runtime.py'
      - 'backend/app/plugin_security_v2/**'
      - 'backend/tests/test_unified_plugin_store.py'
      - 'backend/tests/test_unified_plugin_runtime.py'
      - 'backend/tests/test_unified_chart_context.py'
      - 'frontend/desktop/unified-entry*'
      - 'frontend/tests/fixtures/unified-runtime-client.mjs'
      - 'backend/tests/conftest.py'
      - 'backend/scripts/unified_plugin.py'
      - 'examples/unified-plugins/**'
      - '.github/workflows/unified-plugin-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, python: '3.11'}
          - {os: ubuntu-latest, python: '3.12'}
          - {os: macos-latest, python: '3.12'}
          - {os: windows-latest, python: '3.12'}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install contract and runtime test dependencies
        run: python -m pip install pytest==7.4.4 jsonschema==4.25.1 fastapi==0.115.6 httpx==0.28.1 anyio==4.15.1 python-dotenv==1.0.1 uvicorn==0.34.0
      - name: Run SDK contracts and architecture tests
        working-directory: packages/candlescope-plugin-sdk
        run: python -m pytest -q
      - name: Inspect multi-entry metadata without execution
        run: python backend/scripts/inspect_unified_plugin.py examples/unified-plugins/workbench/manifest.json
      - name: Verify candidate store, concurrency and crash recovery
        working-directory: backend
        env:
          PYTHONPATH: '.'
        run: python -m pytest -q tests/test_unified_plugin_store.py tests/test_unified_plugin_runtime.py tests/test_unified_chart_context.py
      - name: Verify shared window and desktop lifecycle
        working-directory: frontend
        run: node --test desktop/unified-entry-host.test.mjs
