name: Desktop release

# Push a tag such as v1.0.0 to build every desktop package and open a draft
# GitHub Release with them. A maintainer reviews the draft and publishes it.
# Pull requests that change this workflow, and manual runs, are dry runs:
# they build and assemble the same release, and publish nothing.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
    paths:
      - ".github/workflows/desktop-release.yml"
      - ".github/scripts/desktop_release*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ github.ref }}
  # Never cancel a tag's release run halfway; a newer PR push replaces an older dry run.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  version:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    name: Check version and release notes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.check.outputs.version }}
      prerelease: ${{ steps.check.outputs.prerelease }}
      commit: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Test release helpers
        run: node --test .github/scripts/desktop_release.test.mjs
      - name: Tag, app version and release notes agree
        id: check
        env:
          # Only a tag push names a release; other runs check the version files alone.
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: node .github/scripts/desktop_release.mjs check --tag "$TAG"
      - id: commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  macos:
    needs: version
    uses: ./.github/workflows/macos-desktop.yml
    permissions:
      contents: read

  windows:
    needs: version
    uses: ./.github/workflows/windows-desktop.yml
    permissions:
      contents: read

  assemble:
    needs: [version, macos, windows]
    name: Assemble release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Download the verified packages of this commit
        uses: actions/download-artifact@v4
        with:
          pattern: CandleScope-*-${{ needs.version.outputs.commit }}
          path: dist/builds
      - name: Verify checksums and commits, then gather the release
        env:
          VERSION: ${{ needs.version.outputs.version }}
          COMMIT: ${{ needs.version.outputs.commit }}
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          DRY_RUN: ${{ github.ref_type == 'tag' && github.event_name == 'push' && 'false' || 'true' }}
        run: |
          flags=()
          if [[ "$DRY_RUN" == "true" ]]; then flags+=(--dry-run); fi
          node .github/scripts/desktop_release.mjs assemble --input dist/builds --output dist/release \
            --version "$VERSION" --commit "$COMMIT" --tag "$TAG" "${flags[@]}"
          cat dist/release/release-notes.md >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat dist/release/SHA256SUMS >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the assembled release
        uses: actions/upload-artifact@v4
        with:
          name: desktop-release-${{ needs.version.outputs.version }}-${{ needs.version.outputs.commit }}
          path: dist/release/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  publish:
    # Only a pushed tag publishes, and only as a draft for a maintainer to review.
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [version, assemble]
    name: Create draft GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Download the assembled release
        uses: actions/download-artifact@v4
        with:
          name: desktop-release-${{ needs.version.outputs.version }}-${{ needs.version.outputs.commit }}
          path: release
      - name: Create or refresh the draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.version.outputs.version }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
        run: |
          # Upload the packages assemble verified, as SHA256SUMS lists them, so a
          # new package format needs no change here.
          files=()
          while read -r _ name; do files+=("release/$name"); done < release/SHA256SUMS
          test "${#files[@]}" -gt 0
          files+=(release/SHA256SUMS release/build-manifests.json)
          for file in "${files[@]}"; do
            if [[ ! -f "$file" ]]; then echo "::error::Missing $file"; exit 1; fi
          done
          if draft=$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null); then
            # A rerun refreshes its own draft; a published release is never replaced.
            if [[ "$draft" != "true" ]]; then
              echo "::error::Release $TAG is already published. Tag a new version instead."
              exit 1
            fi
            gh release upload "$TAG" "${files[@]}" --clobber
            gh release edit "$TAG" --title "CandleScope $VERSION" --notes-file release/release-notes.md
          else
            flags=(--draft --verify-tag --title "CandleScope $VERSION" --notes-file release/release-notes.md)
            if [[ "$PRERELEASE" == "true" ]]; then flags+=(--prerelease); fi
            gh release create "$TAG" "${flags[@]}" "${files[@]}"
          fi
          echo "Draft release $TAG is ready for review: $(gh release view "$TAG" --json url --jq .url)" >> "$GITHUB_STEP_SUMMARY"
