name: Pine host contracts

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
    paths: ["packages/candlescope-plugin-pine-compat/**", "packages/candlescope-plugin-sdk/**", "frontend/scripts/prepare-desktop-plugins.py", "frontend/scripts/desktop-plugin-sources.json", "backend/tests/test_native_calendar_basis.py", "backend/app/data_engine/bar_aggregator/**", "backend/app/data_engine/data_manager/history_prefix.py", "backend/tests/test_history_prefix*.py", "backend/app/data_engine/backfill/**", "backend/app/data_engine/data_manager/backfill_coordinator.py", "backend/tests/test_history_fetch_stream*.py", "backend/app/data_engine/data_manager/event_bus.py", "backend/app/data_engine/data_manager/manager.py", "backend/tests/test_preview_update_requirements.py", "backend/tests/test_deferred_component_preview*.py", "backend/tests/test_closed_component_retention.py", "backend/tests/test_forming_component_retention.py", "backend/tests/test_source_window_recovery.py", "backend/app/data_engine/aggregation/source_window.py", "backend/app/data_engine/data_manager/source_recovery.py", "backend/app/data_engine/storage/source_window_summary.py", "backend/app/data_engine/storage/kline_sources.py", "backend/app/data_engine/storage/bar_delivery.py", "backend/tests/test_event_bus_routing_index.py", "backend/tests/test_chart_calculation_*.py", ".github/workflows/pine-host-contracts.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pine-host-contracts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    name: Combined Pine contracts (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: windows-latest, platform: windows-amd64}
          - {os: ubuntu-22.04, platform: linux-x86_64}
          - {os: macos-15, platform: macos-arm64}
          - {os: macos-15-intel, platform: macos-x86_64}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.23"
      - uses: dtolnay/rust-toolchain@stable
      - name: Install host qualification dependencies
        working-directory: backend
        run: python -m pip install -r requirements.txt -r requirements-test.txt pytest-asyncio==0.23.8 pytest-timeout==2.4.0
      - name: Build and qualify combined engine, bridge and offline installation
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: >-
          python packages/candlescope-plugin-pine-compat/scripts/qualify_host_contracts.py
          --output output/pine-host-contracts/${{ matrix.platform }}
          --cache output/pine-build-cache
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pine-host-contracts-${{ matrix.platform }}
          path: |
            output/pine-host-contracts/${{ matrix.platform }}/*.json
            output/pine-host-contracts/${{ matrix.platform }}/*.xml
            output/pine-host-contracts/${{ matrix.platform }}/*.whl
            output/pine-host-contracts/${{ matrix.platform }}/*.cspkg
            output/pine-host-contracts/${{ matrix.platform }}/sources/**
          if-no-files-found: warn
