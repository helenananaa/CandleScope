name: CCXT integration

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
    paths: ["backend/**", "packages/**", "frontend/tests/fixtures/run-result/**", ".github/workflows/ccxt-integration.yml"]
  push:
    branches: [main]
    paths: ["backend/**", "packages/**", ".github/workflows/ccxt-integration.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ccxt-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pinned-fork:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      DATA_DIR: ${{ github.workspace }}/output/ccxt-integration/data
      CANDLE_DATA_DIR: ${{ github.workspace }}/output/ccxt-integration/data
      CANDLESCOPE_REQUIRE_CCXT_FORK: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build and verify immutable fork wheel
        run: |
          python -m venv .venv
          .venv/bin/python backend/scripts/install_ccxt_fork.py --build-only
      - name: Install isolated test dependencies
        working-directory: backend
        shell: bash
        run: |
          # Flatten the includes so only the SHA-256-verified local wheel supplies CCXT.
          ../.venv/bin/python -m pip install \
            -r <(sed -e '/^-r /d' -e '/^ccxt @ /d' requirements.txt requirements-parquet.txt requirements-test.txt) \
            .cache/ccxt-fork/*/ccxt-*.whl pytest-asyncio==0.23.8 pytest-timeout==2.4.0
      - name: Verify combined source, boundary, archive and admission contracts
        run: |
          mkdir -p output/ccxt-integration
          .venv/bin/python backend/scripts/ccxt_contracts/integration.py --timeout=90 --junitxml=../output/ccxt-integration/backend.xml
      - name: Verify Python indicator package contracts
        if: success() || failure()
        working-directory: packages/candlescope-plugin-python-indicator
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: >-
          ../../.venv/bin/python -m pytest -q -p no:cacheprovider -p pytest_timeout --timeout=90
          --junitxml=../../output/ccxt-integration/python-indicator.xml
      - name: Upload integration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ccxt-integration-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            output/ccxt-integration/backend.xml
            output/ccxt-integration/python-indicator.xml
            backend/ccxt-fork.lock.json
            backend/.cache/ccxt-fork/*/build.json
          if-no-files-found: ignore

  replay-hedge-oracle:
    # The HEDGE tape parity oracle needs minutes per case, so it runs beside the
    # contract job with its own per-test timeout instead of the 90 s one.
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      DATA_DIR: ${{ github.workspace }}/output/replay-hedge-oracle/data
      CANDLE_DATA_DIR: ${{ github.workspace }}/output/replay-hedge-oracle/data
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        working-directory: backend
        run: python -m pip install -r requirements.txt -r requirements-test.txt pytest-asyncio==0.23.8 pytest-timeout==2.4.0
      - name: Verify HEDGE tape fast paths match the scalar reference
        working-directory: backend
        env:
          PYTHONPATH: "."
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: >-
          python -m pytest -q -p no:cacheprovider -p pytest_asyncio.plugin -p anyio.pytest_plugin
          -p pytest_timeout --timeout=900 tests/test_replay_hedge_tape_interval.py
          --junitxml=../output/replay-hedge-oracle/backend.xml
      - name: Upload oracle evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: replay-hedge-oracle-${{ github.event.pull_request.head.sha || github.sha }}
          path: output/replay-hedge-oracle/backend.xml
          if-no-files-found: ignore
