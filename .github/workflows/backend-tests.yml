name: Backend tests

# Backend test modules that no other workflow runs, staged by
# backend/scripts/ci_backend_tests.py (#577 / #572). The other lists are the
# workflow files, qualify_host_contracts.py and ccxt_contracts/integration.py.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
    paths:
      - "backend/**"
      - "packages/**"
      # test_replay_tape_projection*.py run the frontend replay parser through tsx;
      # phase-10 replay checks read the replay scripts and package.json.
      - "frontend/src/features/replay/**"
      - "frontend/scripts/replay-*"
      - "frontend/package*.json"
      - ".github/workflows/backend-tests.yml"
      - "!**/*.md"
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "packages/**"
      - "frontend/src/features/replay/**"
      - "frontend/scripts/replay-*"
      - "frontend/package*.json"
      - ".github/workflows/backend-tests.yml"
      - "!**/*.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  staged:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      DATA_DIR: ${{ github.workspace }}/output/backend-tests/data
      CANDLE_DATA_DIR: ${{ github.workspace }}/output/backend-tests/data
      PYTHONDONTWRITEBYTECODE: "1"
      # Each stage runs every module in one xdist worker (--dist loadfile), as
      # frontend/scripts/run-tests.mjs does for its parallel backend set.
      PYTEST_STAGE_OPTIONS: >-
        -n 4 --dist loadfile --timeout=300 -rfE
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install test dependencies
        working-directory: backend
        run: python -m pip install -r requirements.txt -r requirements-test.txt pytest-asyncio==0.23.8 pytest-timeout==2.4.0
      - name: Install locked frontend dependencies for the replay parser checks
        working-directory: frontend
        run: npm ci --ignore-scripts
      - name: Replay broker, ledger and orders
        run: |
          mkdir -p output/backend-tests/data
          python backend/scripts/ci_backend_tests.py replay-core --timeout=300 -rfE \
            --junitxml=../output/backend-tests/replay-core.xml
      - name: Replay
        if: success() || failure()
        run: >-
          python backend/scripts/ci_backend_tests.py replay $PYTEST_STAGE_OPTIONS
          --junitxml=../output/backend-tests/replay.xml
      - name: Indicators
        if: success() || failure()
        run: >-
          python backend/scripts/ci_backend_tests.py indicators $PYTEST_STAGE_OPTIONS
          --junitxml=../output/backend-tests/indicators.xml
      - name: Data engine
        if: success() || failure()
        run: >-
          python backend/scripts/ci_backend_tests.py data $PYTEST_STAGE_OPTIONS
          --junitxml=../output/backend-tests/data.xml
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-tests-${{ github.event.pull_request.head.sha || github.sha }}
          path: output/backend-tests/*.xml
          if-no-files-found: ignore
          retention-days: 14
