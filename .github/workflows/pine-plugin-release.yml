name: Pine plugin release

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  qualify:
    if: github.event_name == 'workflow_dispatch' || github.event.release.tag_name == 'candlescope-plugin-pine-compat-v0.3.3'
    name: Published Pine plugin (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: windows-latest, platform: win_amd64, lock: release-lock.json}
          - {os: ubuntu-22.04, platform: linux-x86_64, lock: release-lock.linux-x86_64.json}
          - {os: macos-15, platform: macos-arm64, lock: release-lock.macos-arm64.json}
          - {os: macos-15-intel, platform: macos-x86_64, lock: release-lock.macos-x86_64.json}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install qualification dependencies
        working-directory: backend
        run: python -m pip install -r requirements.txt -r requirements-test.txt pytest-asyncio==0.23.8 pytest-timeout==2.4.0
      - name: Download and verify exact published assets, rebuild bundle and test offline installation
        run: >-
          python packages/candlescope-plugin-pine-compat/scripts/qualify_release.py
          --lock packages/candlescope-plugin-pine-compat/release/${{ matrix.lock }}
          --platform ${{ matrix.platform }} --output dist
      - name: Verify official catalog and platform selection
        working-directory: backend
        run: python -m pytest -q tests/test_first_party_plugin_bootstrap.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: published-pine-${{ matrix.platform }}
          path: |
            dist/*receipt.json
            dist/*-stdout.txt
            dist/*-stderr.txt
            dist/*.xml
          if-no-files-found: error
